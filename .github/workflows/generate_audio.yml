name: Generate long audio

run-name: "SẢNH TRUYỆN ${{ inputs.request_id || github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      content_gzip_base64:
        description: "Compressed UTF-8 script sent by SẢNH TRUYỆN; leave blank to use kichban.txt"
        required: false
        type: string
        default: ""
      request_id:
        description: "Unique request identifier used by the desktop app"
        required: false
        type: string
        default: ""
      voice:
        description: "Giọng đọc tiếng Việt"
        required: true
        type: choice
        default: Nam Minh
        options:
          - Nam Minh
          - Hoài My
      rate:
        description: "Tốc độ đọc"
        required: true
        type: choice
        default: "1.25"
        options: ["0.75", "1.0", "1.25", "1.5", "1.75", "2.0"]

  # Tự tạo audio khi kichban.txt được cập nhật (kể cả khi con ghi file qua GitHub).
  push:
    branches:
      - main
    paths:
      - kichban.txt

permissions:
  contents: read

concurrency:
  group: long-audio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Vietnamese audiobook
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Materialize desktop-supplied script (if provided)
        env:
          SCRIPT_GZIP_B64: ${{ inputs.content_gzip_base64 || '' }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          encoded = os.environ.get("SCRIPT_GZIP_B64", "").strip()
          if not encoded:
              print("No desktop payload supplied; using the checked-in kichban.txt.")
          else:
              if os.environ.get("REPOSITORY_PRIVATE", "").lower() != "true":
                  raise SystemExit(
                      "Desktop payloads are disabled for public repositories. "
                      "Make this repository private before sending story text."
                  )
              try:
                  raw = gzip.decompress(base64.b64decode(encoded, validate=True))
                  text = raw.decode("utf-8-sig")
              except Exception as exc:
                  raise SystemExit(f"Desktop audio payload is invalid: {type(exc).__name__}: {exc}")
              if not text.strip():
                  raise SystemExit("Desktop supplied an empty script.")
              Path("kichban.txt").write_text(text, encoding="utf-8")
              print(f"Loaded desktop script into this runner only: {len(text):,} characters.")
          PY

      - name: Install Edge-TTS with current protocol support
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python - <<'PY'
          from importlib.metadata import version
          from edge_tts.constants import SEC_MS_GEC_VERSION

          print(f"Edge-TTS version: {version('edge-tts')}")
          print(f"Handshake version: {SEC_MS_GEC_VERSION}")
          if not SEC_MS_GEC_VERSION.startswith("2-"):
              raise SystemExit("Edge-TTS chưa hỗ trợ handshake Sec-MS-GEC v2.")
          PY

      - name: Validate kichban.txt
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          source = Path("kichban.txt")
          if not source.is_file():
              sys.exit("Không tìm thấy kichban.txt ở thư mục gốc repository.")
          text = source.read_text(encoding="utf-8-sig")
          if not text.strip():
              sys.exit("kichban.txt đang trống. Hãy sửa tệp này trước khi chạy.")
          if text.strip() == "__DAN_NOI_DUNG_TRUYEN_VAO_DAY__":
              sys.exit("Hãy thay dòng hướng dẫn trong kichban.txt bằng nội dung truyện.")
          print(f"Đã nhận kichban.txt: {len(text):,} ký tự.")
          print("Sẽ tạo một MP3 đầu ra từ toàn bộ kịch bản.")
          PY

      - name: Generate one MP3 from the whole script
        env:
          VOICE_CHOICE: ${{ inputs.voice || 'Nam Minh' }}
          RATE: ${{ inputs.rate || '1.25' }}
        run: |
          case "$VOICE_CHOICE" in
            "Nam Minh") VOICE_ID="vi-VN-NamMinhNeural" ;;
            "Hoài My") VOICE_ID="vi-VN-HoaiMyNeural" ;;
            *) echo "::error::Giọng đọc không hợp lệ"; exit 1 ;;
          esac

          # One whole-script synthesis and one output MP3.
          # Edge-TTS may internally stream text fragments to its service.
          OUTPUT_FILE="outputs/AU ${{ github.run_number }}.mp3"
          echo "AU ID: ${{ github.run_number }}"
          echo "Output: $OUTPUT_FILE"
          timeout --signal=INT --kill-after=30s 340m \
            python generate_audio.py \
              --input kichban.txt \
              --output "$OUTPUT_FILE" \
              --voice "$VOICE_ID" \
              --rate "$RATE" \
              --attempts 3

      - name: Upload MP3
        if: ${{ success() && hashFiles(format('outputs/AU {0}.mp3', github.run_number)) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: AU ${{ github.run_number }}
          path: outputs/AU ${{ github.run_number }}.mp3
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload partial audio for diagnosis if generation fails
        if: ${{ failure() && hashFiles(format('outputs/AU {0}.partial.mp3', github.run_number)) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: AU ${{ github.run_number }} - partial diagnostic
          path: outputs/AU ${{ github.run_number }}.partial.mp3
          if-no-files-found: ignore
          retention-days: 2
          compression-level: 0
